name: Rotate DB Password + SECRET_KEY

# Manual only — never on push. Rotating on every deploy would log out every
# session and race with deploy.yml, so this is a deliberate, separate action
# triggered from the Actions tab (Run workflow).
on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate new credentials
        id: gen
        run: |
          DB_PASS=$(openssl rand -base64 24)
          SECRET_KEY=$(openssl rand -hex 32)
          # Mask immediately: this is a public repo, so these must never
          # appear in a workflow log even by accident in a later step.
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$SECRET_KEY"
          echo "db_pass=$DB_PASS" >> "$GITHUB_OUTPUT"
          echo "secret_key=$SECRET_KEY" >> "$GITHUB_OUTPUT"

      - name: Rotate on the VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_DB_PASS: ${{ steps.gen.outputs.db_pass }}
          NEW_SECRET_KEY: ${{ steps.gen.outputs.secret_key }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_DB_PASS,NEW_SECRET_KEY
          script: |
            set -euo pipefail
            ENV_FILE="/home/farmcareservices_user/MooMe/webapp/backend/.env"

            # Auth with the CURRENT password already on the server — no root
            # MySQL access or new sudoers entry needed, a MySQL user may
            # always change its own password.
            OLD_DB_PASS=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
            MYSQL_PWD="${OLD_DB_PASS}" mysql -u moome_user -e \
              "ALTER USER USER() IDENTIFIED BY '${NEW_DB_PASS}'; FLUSH PRIVILEGES;"

            sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${NEW_DB_PASS}|" "$ENV_FILE"
            sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${NEW_SECRET_KEY}|" "$ENV_FILE"

            sudo -n /usr/bin/systemctl restart fastapi
            echo "Rotated. New values live only in ${ENV_FILE} on this server — not printed here, not in GitHub."
